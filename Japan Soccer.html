<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Japan Soccer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@ruffle-rs/ruffle@latest/ruffle.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      height: 100vh;
      aspect-ratio: 4 / 3;
      max-width: 100vw;
    }

    #game-container ruffle-player {
      width: 100%;
      height: 100%;
    }

    #exit-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff2d2d, #ff6b6b);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(255, 45, 45, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #exit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 45, 45, 0.6);
    }

    #exit-btn:active {
      transform: translateY(0);
    }

    #panic-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 56px;
      height: 56px;
      padding: 0;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 9999;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #panic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    #panic-btn:active {
      transform: translateY(0);
    }

    #panic-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <a id="panic-btn" href="https://sjc.instructure.com/" target="_blank" rel="noopener noreferrer" aria-label="Panic Button">
    <img src="Buttons/Panic Button.png" alt="Panic Button" />
  </a>
  <button id="exit-btn">Exit Game</button>
  <div id="game-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.RufflePlayer = window.RufflePlayer || {};
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("game-container").appendChild(player);
      player.load("SWF Files for Flash/japan_soccer.swf");

      document.getElementById("exit-btn").addEventListener("click", () => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
